[project]
name = "nianbox-server"
version = "0.1.0"
description = "NianBox Server: single-user SQLite REST and MCP service"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mcp>=1.24,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

name: NianBox checks
on:
  push:
    branches-ignore: ["dependabot/**"]
    tags: ["v*"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  server:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.13"
      - run: uv sync --project Server --locked --python 3.12
      - run: cd Server && uv run pytest -q
      - run: python3 Scripts/check_version.py
      - run: cmp LICENSE Server/LICENSE
      - run: docker build -t nianbox-server-test Server
      - run: python3 Scripts/verify_container.py nianbox-server-test
  macos:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec ruby Scripts/verify_project_generation.rb
      - run: xcodebuild test -project NianBox.xcodeproj -scheme NianBox -destination 'platform=macOS' -derivedDataPath DerivedData -only-testing:NianBoxTests CODE_SIGNING_ALLOWED=NO
      - uses: astral-sh/setup-uv@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          version: "0.7.13"
          enable-cache: false
      - name: Build and verify universal DMG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          uv venv --python 3.12 .local/packaging-venv
          uv pip install --python .local/packaging-venv/bin/python -r Scripts/dmg-requirements.txt
          NIANBOX_PACKAGING_PYTHON="$PWD/.local/packaging-venv/bin/python" bash Scripts/build_release.sh
      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Scripts/stage_release.py
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [server, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        timeout-minutes: 3
        with:
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          version=$(cat VERSION)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
            echo "tags=$image:$version,$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:main,$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./Server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Deploy with NIANBOX_IMAGE=$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: nianbox-stable-promotion
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published runtime
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          python3 Scripts/verify_container.py "$IMAGE@$DIGEST"
      - name: Publish release and promote stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIANBOX_RELEASE_IMAGE: ${{ needs.publish.outputs.image }}
          NIANBOX_RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 Scripts/finalize_release.py

name: NianBox checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.13"
      - run: uv sync --project Server --locked --python 3.12
      - run: cd Server && uv run pytest -q
      - run: cmp LICENSE Server/LICENSE
      - run: docker build -t nianbox-server-test Server
      - run: python3 Scripts/verify_container.py nianbox-server-test
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec ruby Scripts/verify_project_generation.rb
      - run: xcodebuild test -project NianBox.xcodeproj -scheme NianBox -destination 'platform=macOS' -derivedDataPath DerivedData -only-testing:NianBoxTests CODE_SIGNING_ALLOWED=NO
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ./Server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Deploy with NIANBOX_IMAGE=$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

name: NianBox checks
on:
  push:
    branches-ignore: ["dependabot/**"]
    tags: ["v*"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  server:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.13"
      - run: uv sync --project Server --locked --python 3.12
      - run: cd Server && uv run pytest -q
      - run: python3 Scripts/check_version.py
      - run: cmp LICENSE Server/LICENSE
      - run: docker build -t nianbox-server-test Server
      - run: python3 Scripts/verify_container.py nianbox-server-test
  macos:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec ruby Scripts/verify_project_generation.rb
      - run: xcodebuild test -project NianBox.xcodeproj -scheme NianBox -destination 'platform=macOS' -derivedDataPath DerivedData -only-testing:NianBoxTests CODE_SIGNING_ALLOWED=NO
      - uses: astral-sh/setup-uv@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          version: "0.7.13"
          enable-cache: false
      - name: Build and verify universal DMG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          uv venv --python 3.12 .local/packaging-venv
          uv pip install --python .local/packaging-venv/bin/python -r Scripts/dmg-requirements.txt
          NIANBOX_PACKAGING_PYTHON="$PWD/.local/packaging-venv/bin/python" bash Scripts/build_release.sh
      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Scripts/stage_release.py
  container-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        timeout-minutes: 3
        with:
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both architectures without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./Server
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/nianbox-toolchain.tar
          provenance: mode=max
          sbom: true
      - name: Verify exported architectures
        env:
          OCI_ARCHIVE: ${{ runner.temp }}/nianbox-toolchain.tar
        run: |
          python3 - <<'PY'
          import json
          import os
          import tarfile

          platforms = set()
          with tarfile.open(os.environ['OCI_ARCHIVE']) as archive:
              def visit(index):
                  for descriptor in index.get('manifests', []):
                      platform = descriptor.get('platform', {})
                      if platform.get('os') == 'linux':
                          platforms.add(platform['os'] + '/' + platform['architecture'])
                      if descriptor['mediaType'] in (
                          'application/vnd.oci.image.index.v1+json',
                          'application/vnd.docker.distribution.manifest.list.v2+json',
                      ):
                          path = 'blobs/' + descriptor['digest'].replace(':', '/')
                          visit(json.load(archive.extractfile(path)))
              visit(json.load(archive.extractfile('index.json')))
          assert platforms == {'linux/amd64', 'linux/arm64'}, platforms
          print('PASS: exported ' + ', '.join(sorted(platforms)))
          PY
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [server, macos, container-toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        timeout-minutes: 3
        with:
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          version=$(cat VERSION)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
            echo "tags=$image:$version,$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:main,$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./Server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Deploy with NIANBOX_IMAGE=$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: nianbox-stable-promotion
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published runtime
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          python3 Scripts/verify_container.py "$IMAGE@$DIGEST"
      - name: Publish release and promote stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIANBOX_RELEASE_IMAGE: ${{ needs.publish.outputs.image }}
          NIANBOX_RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 Scripts/finalize_release.py
